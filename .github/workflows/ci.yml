name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: No known high/critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run check:migrations
      - run: npm test

  docker:
    name: docker image + compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start postgres, migrate, api and worker
        run: docker compose up -d --build --wait
      - run: bash scripts/compose-smoke.sh
      - name: Image vulnerability scan (fixable HIGH/CRITICAL fail the build)
        # Pinned to a commit: the action's tags are "v"-prefixed and tags can move. Scans OS and library packages.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: merchantflo:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  infra:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: terraform validate (bootstrap and every environment)
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugins
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in bootstrap envs/dev envs/staging envs/production; do
            echo "::group::$dir"
            terraform -chdir=infra/$dir init -backend=false -input=false
            terraform -chdir=infra/$dir validate
            echo "::endgroup::"
          done
