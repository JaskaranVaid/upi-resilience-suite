name: Secret scan

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum-verified)
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          file="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL "$base/gitleaks_${VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c
          tar -xzf "$file" gitleaks
      - name: Scan (allowlist in .gitleaks.toml)
        run: ./gitleaks git --redact --no-banner --verbose .
